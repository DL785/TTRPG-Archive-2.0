.board-role-picker{display:flex;align-items:center;gap:10px;font-size:12px;color:#a0a9bc}.board-role-picker select{background:#20263d;color:#e5e7e4;border:1px solid #414c60;border-radius:7px;padding:8px}@media(max-width:700px){.board-role-picker>span{display:none}.workspace-tabs button{padding:0 9px}}
